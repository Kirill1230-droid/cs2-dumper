name: auto-update offsets

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download offsets from a2x/cs2-dumper
        run: |
          curl -fsSL -o offsets_raw.json \
            "https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/offsets.json"
          echo "--- size ---"
          wc -c offsets_raw.json
          echo "--- first 20 lines ---"
          head -20 offsets_raw.json

      - name: Convert to loader format
        run: |
          python3 << 'PYEOF'
          import json

          raw = json.load(open('offsets_raw.json'))
          out = {}

          if 'client.dll' in raw and isinstance(raw['client.dll'], dict):
              for k, v in raw['client.dll'].items():
                  if isinstance(v, int):
                      out[k] = hex(v)
                  else:
                      out[k] = str(v)
          else:
              for k, v in raw.items():
                  if isinstance(v, int):
                      out[k] = hex(v)
                  elif isinstance(v, str):
                      out[k] = v

          json.dump(out, open('offsets.json','w'), indent=2)
          print(f'[+] saved {len(out)} offsets')
          if out:
              print('--- sample ---')
              for k in list(out.keys())[:15]:
                  print(f'  {k} = {out[k]}')
          PYEOF

      - name: Commit to repo
        run: |
          git config user.name "auto-offsets-bot"
          git config user.email "bot@users.noreply.github.com"
          git add offsets.json
          if ! git diff --cached --quiet; then
            git commit -m "auto offsets $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "no changes"
          fi

      - name: Update gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -n "$GH_TOKEN" ] && [ -n "$GIST_ID" ]; then
            jq -Rs '{files:{("offsets.json"):{content:.}}}' offsets.json > body.json
            gh api -X PATCH /gists/$GIST_ID --input body.json
            echo "[+] gist updated"
          else
            echo "[!] no GIST_TOKEN or GIST_ID"
            exit 1
          fi
