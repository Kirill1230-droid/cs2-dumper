name: auto-update offsets

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download offsets from a2x/cs2-dumper
        run: |
          curl -fsSL -o client_dll.hpp \
            "https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/client_dll.hpp" || echo "client_dll.hpp failed"
          curl -fsSL -o offsets.hpp \
            "https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/offsets.hpp" || echo "offsets.hpp failed"
          ls -la *.hpp
          echo "--- first lines of client_dll.hpp ---"
          head -20 client_dll.hpp || true

      - name: Convert hpp to json
        run: |
          python3 << 'PYEOF'
          import re, json, os

          out = {}

          for fname in ['client_dll.hpp', 'offsets.hpp']:
              if not os.path.exists(fname):
                  continue
              text = open(fname).read()
              for m in re.finditer(r'constexpr\s+std::uintptr_t\s+(\w+)\s*=\s*(0x[0-9A-Fa-f]+)', text):
                  out[m.group(1)] = m.group(2).lower()

          json.dump(out, open('offsets.json','w'), indent=2)
          print(f'[+] saved {len(out)} offsets')
          if out:
              print('--- keys ---')
              print('\n'.join(list(out.keys())[:20]))
          PYEOF

      - name: Commit to repo
        run: |
          git config user.name "auto-offsets-bot"
          git config user.email "bot@users.noreply.github.com"
          git add offsets.json
          if ! git diff --cached --quiet; then
            git commit -m "auto offsets $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "no changes"
          fi

      - name: Update gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -n "$GH_TOKEN" ] && [ -n "$GIST_ID" ]; then
            jq -Rs '{files:{("offsets.json"):{content:.}}}' offsets.json > body.json
            gh api -X PATCH /gists/$GIST_ID --input body.json
            echo "[+] gist updated"
          else
            echo "[!] no GIST_TOKEN or GIST_ID, skipping"
          fi
